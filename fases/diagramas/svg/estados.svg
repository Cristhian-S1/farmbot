xt><text x="330.0" y="356.88000000000005" font-family="Arial,sans-serif" font-size="24" text-anchor="middle" fill="#111111">Pausada</text><text x="330.0" y="386.1600000000001" font-family="Arial,sans-serif" font-size="24" text-anchor="middle" fill="#111111">obstáculo o incidencia</text><text x="330.0" y="415.44000000000005" font-family="Arial,sans-serif" font-size="24" text-anchor="middle" fill="#111111">orden de detención</text><text x="770.0" y="603.52" font-family="Arial,sans-serif" font-size="24" text-anchor="middle" fill="#111111">Adquisición cerrada</text><text x="770.0" y="632.8" font-family="Arial,sans-serif" font-size="24" text-anchor="middle" fill="#111111">evidencia conservada</text><text x="330.0" y="603.52" font-family="Arial,sans-serif" font-size="24" text-anchor="middle" fill="#111111">Procesando</text><text x="330.0" y="632.8" font-family="Arial,sans-serif" font-size="24" text-anchor="middle" fill="#111111">análisis y registro</text><text x="330.0" y="829.52" font-family="Arial,sans-serif" font-size="24" text-anchor="middle" fill="#111111">Completada</text><text x="330.0" y="858.8" font-family="Arial,sans-serif" font-size="24" text-anchor="middle" fill="#111111">resultados disponibles</text><text x="770.0" y="815.7600000000001" font-family="Arial,sans-serif" font-size="23" text-anchor="middle" fill="#111111">Incompleta / cancelada</text><text x="770.0" y="843.82" font-family="Arial,sans-serif" font-size="23" text-anchor="middle" fill="#111111">zonas pendientes</text><text x="770.0" y="871.8800000000001" font-family="Arial,sans-serif" font-size="23" text-anchor="middle" fill="#111111">visibles</text><rect x="503.045" y="82.0" width="93.91000000000001" height="31" fill="white"/><text x="550" y="106.0" font-family="Arial,sans-serif" font-size="21" font-weight="400" text-anchor="middle" fill="#111111">INICIAR</text><rect x="694.96" y="236.0" width="194.08" height="31" fill="white"/><text x="792" y="260.0" font-family="Arial,sans-serif" font-size="21" font-weight="400" text-anchor="middle" fill="#111111">[CONDICIONES OK]</text><rect x="349.48" y="196.0" width="105.04" height="31" fill="white"/><text x="402" y="220.0" font-family="Arial,sans-serif" font-size="21" font-weight="400" text-anchor="middle" fill="#111111">RECHAZAR</text><rect x="447.395" y="304.0" width="205.21" height="31" fill="white"/><text x="550" y="328.0" font-family="Arial,sans-serif" font-size="21" font-weight="400" text-anchor="middle" fill="#111111">DISTANCIA &lt; 0,5 m</text><rect x="447.395" y="442.0" width="205.21" height="31" fill="white"/><text x="550" y="466.0" font-family="Arial,sans-serif" font-size="21" font-weight="400" text-anchor="middle" fill="#111111">REANUDAR [SEGURO]</text><rect x="772.785" y="480.0" width="138.43" height="31" fill="white"/><text x="842" y="504.0" font-family="Arial,sans-serif" font-size="21" font-weight="400" text-anchor="middle" fill="#111111">FIN DE RUTA</text><rect x="497.48" y="562.0" width="105.04" height="31" fill="white"/><text x="550" y="586.0" font-family="Arial,sans-serif" font-size="21" font-weight="400" text-anchor="middle" fill="#111111">ANALIZAR</text><rect x="356.78499999999997" y="696.0" width="138.43" height="31" fill="white"/><text x="426" y="720.0" font-family="Arial,sans-serif" font-size="21" font-weight="400" text-anchor="middle" fill="#111111">REGISTRO OK</text><rect x="457.395" y="730.0" width="205.21" height="31" fill="white"/><text x="560" y="754.0" font-family="Arial,sans-serif" font-size="21" font-weight="400" text-anchor="middle" fill="#111111">ERROR DE REGISTRO</text><rect x="400.875" y="896.0" width="294.25" height="31" fill="white"/><text x="548" y="920.0" font-family="Arial,sans-serif" font-size="21" font-weight="400" text-anchor="middle" fill="#111111">CANCELAR / NO RECUPERABLE</text><text x="32" y="986.0" font-family="Arial,sans-serif" font-size="21" font-weight="400" text-anchor="start" fill="#111111">Sin comunicación: detener; preservar capturas; reanudar solo tras verificación.</text></svg>