cha &lt; 2 s con ≥ 200 zonas; medir bajo una carga de prueba definida.</text><text x="32" y="1086.0" font-family="Arial,sans-serif" font-size="20" font-weight="400" text-anchor="start" fill="#505050">CU2 · RF6 · RFN4 · RFN6 · La selección de zona y recorrido se conserva al reintentar.</text></svg>