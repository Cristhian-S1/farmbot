="#111111">4 Registros ordenados por fecha</text><text x="36" y="400" font-size="17" font-weight="bold" text-anchor="start" fill="#111111">ALT [hay registros de la zona]</text><rect x="352" y="425" width="297" height="24" fill="white"/><text x="500" y="442" font-size="17" font-weight="normal" text-anchor="middle" fill="#111111">5 Lista de recorridos por fecha</text><rect x="163" y="475" width="186" height="24" fill="white"/><text x="257" y="492" font-size="17" font-weight="normal" text-anchor="middle" fill="#111111">6 Mostrar historial</text><rect x="131" y="525" width="251" height="24" fill="white"/><text x="257" y="542" font-size="17" font-weight="normal" text-anchor="middle" fill="#111111">7 Seleccionar un recorrido</text><rect x="324" y="575" width="352" height="24" fill="white"/><text x="500" y="592" font-size="17" font-weight="normal" text-anchor="middle" fill="#111111">8 Solicitar su evidencia y resultados</text><rect x="329" y="625" width="342" height="24" fill="white"/><text x="500" y="642" font-size="17" font-weight="normal" text-anchor="middle" fill="#111111">9 Evidencia con hilera, zona y fecha</text><text x="52" y="706" font-size="17" font-weight="bold" text-anchor="start" fill="#111111">OPT [imagen no disponible]</text><rect x="62" y="731" width="388" height="24" fill="white"/><text x="257" y="748" font-size="17" font-weight="normal" text-anchor="middle" fill="#111111">10 Avisar imagen ausente; conservar datos</text><rect x="67" y="787" width="379" height="24" fill="white"/><text x="257" y="804" font-size="17" font-weight="normal" text-anchor="middle" fill="#1f4e79">11 Mostrar evidencia y volver a la ficha</text><text x="36" y="874" font-size="17" font-weight="bold" text-anchor="start" fill="#111111">[historial vacío o error de consulta]</text><rect x="310" y="899" width="379" height="24" fill="white"/><text x="500" y="916" font-size="17" font-weight="normal" text-anchor="middle" fill="#111111">5 Estado explícito, sin datos inventados</text><rect x="108" y="949" width="297" height="24" fill="white"/><text x="257" y="966" font-size="17" font-weight="normal" text-anchor="middle" fill="#111111">6 Informar y permitir reintento</text><text x="36" y="1066" font-size="16" font-weight="normal" text-anchor="start" fill="#111111" font-style="italic">Al volver a la ficha se conserva la zona seleccionada. Si no hay recorridos anteriores se informa que el historial está vacío.</text><text x="36" y="1120" font-size="16" font-weight="normal" text-anchor="start" fill="#555555">CU3 · RF6 · RFN4 · RFN6 · La evidencia se muestra con su identificador, hilera, zona y fecha originales.</text></svg></div></main></body></html>
