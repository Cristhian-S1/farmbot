<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 760" role="img" aria-labelledby="subsistemas-title subsistemas-desc" font-family="Arial,sans-serif"><title id="subsistemas-title">Arquitectura tecnológica y persistencia del prototipo</title><desc id="subsistemas-desc">Despliegue de Sabueso: el Go2 EDU entrega video al dock Jetson, que detecta con ONNX Runtime y envía registros por HTTP a la API Flask con SQLite; el agricultor consulta la web React y el video en vivo. El movimiento y la seguridad están pendientes.</desc><defs><marker id="subsistemas-flecha" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polygon points="0 0,10 4,0 8" fill="#505050"/></marker><marker id="subsistemas-flecha-az" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polygon points="0 0,10 4,0 8" fill="#1f4e79"/></marker></defs><rect width="100%" height="100%" fill="white"/><text x="36" y="44" font-size="26" font-weight="bold" text-anchor="start" fill="#111111">Arquitectura tecnológica y persistencia</text><rect x="280" y="96" width="410" height="410" rx="8" fill="none" stroke="#b8c3ca" stroke-width="1.5" stroke-dasharray="7 5"/><text x="292" y="120" font-size="15" font-weight="bold" text-anchor="start" fill="#555555">DOCK JETSON · Python 3.8 · 192.168.123.18</text><rect x="750" y="96" width="230" height="120" rx="8" fill="none" stroke="#b8c3ca" stroke-width="1.5" stroke-dasharray="7 5"/><text x="762" y="120" font-size="15" font-weight="bold" text-anchor="start" fill="#555555"></text><rect x="750" y="300" width="230" height="250" rx="8" fill="none" stroke="#b8c3ca" stroke-width="1.5" stroke-dasharray="7 5"/><text x="762" y="324" font-size="15" font-weight="bold" text-anchor="start" fill="#555555">CLIENTE</text><path d="M 36 698 L 964 698" stroke="#505050" stroke-width="2" fill="none"/><path d="M 224 170 L 300 170" fill="none" stroke="#505050" stroke-width="2" marker-end="url(#subsistemas-flecha)"/><path d="M 390 200 L 390 225" fill="none" stroke="#505050" stroke-width="2" marker-end="url(#subsistemas-flecha)"/><path d="M 390 285 L 390 310" fill="none" stroke="#505050" stroke-width="2" marker-end="url(#subsistemas-flecha)"/><path d="M 390 370 L 390 395" fill="none" stroke="#505050" stroke-width="2" marker-end="url(#subsistemas-flecha)"/><path d="M 480 425 L 700 425 L 700 375 L 762 375" fill="none" stroke="#505050" stroke-width="2" marker-end="url(#subsistemas-flecha)"/><path d="M 865 410 L 865 440" fill="none" stroke="#505050" stroke-width="2" marker-end="url(#subsistemas-flecha)"/><path d="M 865 340 L 865 200" fill="none" stroke="#1f4e79" stroke-width="2" marker-end="url(#subsistemas-flecha)"/><path d="M 670 170 L 760 170" fill="none" stroke="#1f4e79" stroke-width="2" marker-end="url(#subsistemas-flecha)"/><path d="M 380 560 L 380 506" fill="none" stroke="#505050" stroke-width="2" marker-end="url(#subsistemas-flecha)"/><path d="M 625 560 L 625 506" fill="none" stroke="#505050" stroke-width="2" marker-end="url(#subsistemas-flecha)"/><rect x="24" y="130" width="200" height="100" rx="6" fill="#f3f4f6" stroke="#222" stroke-width="2" stroke-dasharray="7 5"/><text x="124" y="164" font-size="19" font-weight="bold" text-anchor="middle" fill="#111">Go2 EDU</text><text x="124" y="186" font-size="16" font-weight="normal" text-anchor="middle" fill="#555555">cámara frontal</text><text x="124" y="208" font-size="16" font-weight="normal" text-anchor="middle" fill="#555555">H264 por RTP multicast</text><rect x="300" y="140" width="180" height="60" rx="6" fill="#f3f4f6" stroke="#222" stroke-width="2"/><text x="390" y="165" font-size="18" font-weight="bold" text-anchor="middle" fill="#111">camara</text><text x="390" y="187" font-size="15" font-weight="normal" text-anchor="middle" fill="#555555">OpenCV + GStreamer</text><rect x="300" y="225" width="180" height="60" rx="6" fill="#eaf2f8" stroke="#1f4e79" stroke-width="2"/><text x="390" y="250" font-size="18" font-weight="bold" text-anchor="middle" fill="#1f4e79">deteccion</text><text x="390" y="272" font-size="15" font-weight="normal" text-anchor="middle" fill="#555555">ONNX Runtime</text><rect x="300" y="310" width="180" height="60" rx="6" fill="#f3f4f6" stroke="#222" stroke-width="2"/><text x="390" y="335" font-size="18" font-weight="bold" text-anchor="middle" fill="#111">recorrido</text><text x="390" y="357" font-size="15" font-weight="normal" text-anchor="middle" fill="#555555">orquesta el flujo</text><rect x="300" y="395" width="180" height="60" rx="6" fill="#f3f4f6" stroke="#222" stroke-width="2"/><text x="390" y="420" font-size="18" font-weight="bold" text-anchor="middle" fill="#111">registro</text><text x="390" y="442" font-size="15" font-weight="normal" text-anchor="middle" fill="#555555">cola local de envíos</text><rect x="500" y="140" width="170" height="60" rx="6" fill="#f3f4f6" stroke="#222" stroke-width="2"/><text x="585" y="165" font-size="18" font-weight="bold" text-anchor="middle" fill="#111">transmision</text><text x="585" y="187" font-size="15" font-weight="normal" text-anchor="middle" fill="#555555">MJPEG, puerto 8080</text><rect x="500" y="250" width="170" height="100" rx="6" fill="#fafafa" stroke="#9aa3ab" stroke-width="2" stroke-dasharray="7 5"/><text x="585" y="284" font-size="16" font-weight="normal" text-anchor="middle" fill="#7b8794">movimiento y</text><text x="585" y="306" font-size="16" font-weight="normal" text-anchor="middle" fill="#7b8794">seguridad</text><text x="585" y="328" font-size="15" font-weight="normal" text-anchor="middle" fill="#7b8794">pendiente</text><rect x="760" y="110" width="210" height="90" rx="6" fill="#f3f4f6" stroke="#222" stroke-width="2"/><text x="865" y="139" font-size="19" font-weight="bold" text-anchor="middle" fill="#111">Agricultor</text><text x="865" y="161" font-size="15" font-weight="normal" text-anchor="middle" fill="#555555">navegador con la web</text><text x="865" y="183" font-size="15" font-weight="normal" text-anchor="middle" fill="#555555">React y TypeScript</text><rect x="762" y="340" width="206" height="70" rx="6" fill="#f3f4f6" stroke="#222" stroke-width="2"/><text x="865" y="370" font-size="19" font-weight="bold" text-anchor="middle" fill="#111">API Flask</text><text x="865" y="392" font-size="15" font-weight="normal" text-anchor="middle" fill="#555555">puerto 5000</text><rect x="762" y="440" width="206" height="90" rx="6" fill="#f3f4f6" stroke="#222" stroke-width="2"/><text x="865" y="469" font-size="19" font-weight="bold" text-anchor="middle" fill="#111">SQLite</text><text x="865" y="491" font-size="15" font-weight="normal" text-anchor="middle" fill="#555555">sabueso.db</text><text x="865" y="513" font-size="15" font-weight="normal" text-anchor="middle" fill="#555555">carpeta de fotos</text><rect x="280" y="560" width="200" height="80" rx="6" fill="#f3f4f6" stroke="#222" stroke-width="2"/><text x="380" y="595" font-size="18" font-weight="bold" text-anchor="middle" fill="#111">PC con GPU</text><text x="380" y="617" font-size="15" font-weight="normal" text-anchor="middle" fill="#555555">ml/: entrena y exporta</text><rect x="520" y="560" width="210" height="80" rx="6" fill="#f3f4f6" stroke="#222" stroke-width="2"/><text x="625" y="595" font-size="18" font-weight="bold" text-anchor="middle" fill="#111">PC o VM Ubuntu 22.04</text><text x="625" y="617" font-size="15" font-weight="normal" text-anchor="middle" fill="#555555">red y despliegue por SSH</text><text x="262" y="160" font-size="15" font-weight="normal" text-anchor="middle" fill="#111111">1 video</text><text x="592" y="456" font-size="15" font-weight="normal" text-anchor="middle" fill="#111111">2 POST /api/registros</text><text x="874" y="430" font-size="15" font-weight="normal" text-anchor="start" fill="#111111">3 guardar</text><rect x="682" y="265" width="174" height="22" fill="white"/><text x="856" y="280" font-size="15" font-weight="normal" text-anchor="end" fill="#111111">4 GET /api/registros</text><rect x="682" y="145" width="69" height="22" fill="white"/><text x="716" y="160" font-size="15" font-weight="normal" text-anchor="middle" fill="#111111">5 video</text><rect x="325" y="525" width="109" height="22" fill="white"/><text x="380" y="540" font-size="15" font-weight="normal" text-anchor="middle" fill="#111111">modelo .onnx</text><rect x="583" y="525" width="85" height="22" fill="white"/><text x="625" y="540" font-size="15" font-weight="normal" text-anchor="middle" fill="#111111">SSH y red</text><text x="36" y="676" font-size="16" font-weight="normal" text-anchor="start" fill="#111111" font-style="italic">El detector corre en el dock. La estación de entrenamiento y la de despliegue no participan durante el recorrido.</text><text x="36" y="728" font-size="15" font-weight="normal" text-anchor="start" fill="#555555">Línea discontinua: hardware externo o bloque pendiente · azul: ruta de consulta del agricultor · el pendiente no tiene código vigente</text></svg>