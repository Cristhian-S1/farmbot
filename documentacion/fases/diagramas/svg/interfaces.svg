<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 880" role="img" aria-labelledby="interfaces-title interfaces-desc"><title id="interfaces-title">Navegación y recuperación de contexto de consulta</title><desc id="interfaces-desc">Mapa, ficha e historial conservan sector, hilera, zona y recorrido; errores tienen recuperación.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polygon points="0 0,10 4,0 8" fill="#505050"/></marker></defs><rect width="100%" height="100%" fill="white"/><path d="M 428 156 L 568 156" fill="none" stroke="#505050" stroke-width="2"  marker-end="url(#arrow)"/><path d="M 568 220 L 428 220" fill="none" stroke="#505050" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/><path d="M 768 244 L 768 468" fill="none" stroke="#505050" stroke-width="2"  marker-end="url(#arrow)"/><path d="M 688 468 L 688 244" fill="none" stroke="#505050" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/><path d="M 568 552 L 428 552" fill="none" stroke="#505050" stroke-width="2"  marker-end="url(#arrow)"/><path d="M 232 468 L 232 244" fill="none" stroke="#505050" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/><path d="M 32 812 L 968 812" fill="none" stroke="#505050" stroke-width="2"  /><rect x="48" y="120" width="380" height="124" rx="4" fill="#edf4f8" stroke="#174d70" stroke-width="2"/><rect x="568" y="120" width="380" height="124" rx="4" fill="#f3f5f6" stroke="#111111" stroke-width="2"/><rect x="568" y="468" width="380" height="124" rx="4" fill="#f3f5f6" stroke="#111111" stroke-width="2"/><rect x="48" y="468" width="380" height="124" rx="4" fill="#f3f5f6" stroke="#111111" stroke-width="2"/><text x="32" y="42.0" font-family="Arial,sans-serif" font-size="28" font-weight="600" text-anchor="start" fill="#111111">Navegación y recuperación de contexto de consulta</text><text x="238.0" y="160.88" font-family="Arial,sans-serif" font-size="24" text-anchor="middle" fill="#111111">CU4 Mapa del cultivo</text><text x="238.0" y="190.16" font-family="Arial,sans-serif" font-size="24" text-anchor="middle" fill="#111111">seleccionar sector y recorrido</text><text x="238.0" y="219.44" font-family="Arial,sans-serif" font-size="24" text-anchor="middle" fill="#111111">filtrar hilera / estado</text><text x="758.0" y="160.88" font-family="Arial,sans-serif" font-size="24" text-anchor="middle" fill="#111111">CU2 Ficha de zona</text><text x="758.0" y="190.16" font-family="Arial,sans-serif" font-size="24" text-anchor="middle" fill="#111111">evidencia · conteos · hallazgos</text><text x="758.0" y="219.44" font-family="Arial,sans-serif" font-size="24" text-anchor="middle" fill="#111111">identidad y fecha</text><text x="758.0" y="508.88000000000005" font-family="Arial,sans-serif" font-size="24" text-anchor="middle" fill="#111111">CU3 Historial de zona</text><text x="758.0" y="538.1600000000001" font-family="Arial,sans-serif" font-size="24" text-anchor="middle" fill="#111111">recorridos ordenados por fecha</text><text x="758.0" y="567.44" font-family="Arial,sans-serif" font-size="24" text-anchor="middle" fill="#111111">abrir evidencia anterior</text><text x="238.0" y="508.88000000000005" font-family="Arial,sans-serif" font-size="24" text-anchor="middle" fill="#111111">Estados de consulta</text><text x="238.0" y="538.1600000000001" font-family="Arial,sans-serif" font-size="24" text-anchor="middle" fill="#111111">sin datos · análisis pendiente</text><text x="238.0" y="567.44" font-family="Arial,sans-serif" font-size="24" text-anchor="middle" fill="#111111">error y reintento</text><rect x="430.78499999999997" y="104.0" width="138.43" height="31" fill="white"/><text x="500" y="128.0" font-family="Arial,sans-serif" font-size="21" font-weight="400" text-anchor="middle" fill="#111111">ELEGIR ZONA</text><rect x="458.61" y="248.0" width="82.78" height="31" fill="white"/><text x="500" y="272.0" font-family="Arial,sans-serif" font-size="21" font-weight="400" text-anchor="middle" fill="#111111">VOLVER</text><rect x="803.915" y="336.0" width="116.17" height="31" fill="white"/><text x="862" y="360.0" font-family="Arial,sans-serif" font-size="21" font-weight="400" text-anchor="middle" fill="#111111">HISTORIAL</text><rect x="539.48" y="332.0" width="105.04" height="31" fill="white"/><text x="592" y="356.0" font-family="Arial,sans-serif" font-size="21" font-weight="400" text-anchor="middle" fill="#111111">REGISTRO</text><rect x="417.655" y="568.0" width="160.69" height="31" fill="white"/><text x="498" y="592.0" font-family="Arial,sans-serif" font-size="21" font-weight="400" text-anchor="middle" fill="#111111">SIN RESULTADO</text><rect x="52.349999999999994" y="344.0" width="127.30000000000001" height="31" fill="white"/><text x="116" y="368.0" font-family="Arial,sans-serif" font-size="21" font-weight="400" text-anchor="middle" fill="#111111">REINTENTAR</text><text x="48" y="672.0" font-family="Arial,sans-serif" font-size="24" font-weight="400" text-anchor="start" fill="#111111">Contexto conservado: sector + hilera + zona + recorrido + filtros.</text><text x="48" y="716.0" font-family="Arial,sans-serif" font-size="24" font-weight="400" text-anchor="start" fill="#111111">El color refuerza la etiqueta; los estados nunca sustituyen la evidencia.</text><text x="32" y="846.0" font-family="Arial,sans-serif" font-size="20" font-weight="400" text-anchor="start" fill="#505050">RFN6 · Ningún retorno cambia la zona seleccionada ni mezcla datos de recorridos distintos.</text></svg>