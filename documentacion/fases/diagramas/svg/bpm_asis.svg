<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 876" role="img" aria-labelledby="bpm_asis-title bpm_asis-desc"><title id="bpm_asis-title">Proceso actual de inspección y pérdida de trazabilidad</title><desc id="bpm_asis-desc">Inspección manual, anotación informal y decisiones de manejo; la evidencia histórica puede perderse.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polygon points="0 0,10 4,0 8" fill="#505050"/></marker></defs><rect width="100%" height="100%" fill="white"/><path d="M 404 174 L 596 174" fill="none" stroke="#505050" stroke-width="2"  marker-end="url(#arrow)"/><path d="M 766 224 L 766 328" fill="none" stroke="#505050" stroke-width="2"  marker-end="url(#arrow)"/><path d="M 596 378 L 404 378" fill="none" stroke="#505050" stroke-width="2"  marker-end="url(#arrow)"/><path d="M 234 428 L 234 532" fill="none" stroke="#505050" stroke-width="2"  marker-end="url(#arrow)"/><path d="M 404 582 L 596 582" fill="none" stroke="#505050" stroke-width="2"  marker-end="url(#arrow)"/><path d="M 32 808 L 968 808" fill="none" stroke="#505050" stroke-width="2"  /><rect x="64" y="124" width="340" height="100" rx="4" fill="#f3f5f6" stroke="#111111" stroke-width="2"/><rect x="596" y="124" width="340" height="100" rx="4" fill="#f3f5f6" stroke="#111111" stroke-width="2"/><rect x="596" y="328" width="340" height="100" rx="4" fill="#f3f5f6" stroke="#111111" stroke-width="2"/><rect x="64" y="328" width="340" height="100" rx="4" fill="#f3f5f6" stroke="#111111" stroke-width="2"/><rect x="64" y="532" width="340" height="100" rx="4" fill="#f3f5f6" stroke="#111111" stroke-width="2"/><rect x="596" y="532" width="340" height="100" rx="4" fill="#f3f5f6" stroke="#111111" stroke-width="2"/><text x="32" y="42.0" font-family="Arial,sans-serif" font-size="28" font-weight="600" text-anchor="start" fill="#111111">Proceso actual de inspección y pérdida de trazabilidad</text><text x="234.0" y="181.82" font-family="Arial,sans-serif" font-size="23" text-anchor="middle" fill="#111111">Planificar visita</text><text x="766.0" y="181.82" font-family="Arial,sans-serif" font-size="23" text-anchor="middle" fill="#111111">Recorrer hileras</text><text x="766.0" y="385.82" font-family="Arial,sans-serif" font-size="23" text-anchor="middle" fill="#111111">Inspeccionar fruto y follaje</text><text x="234.0" y="385.82" font-family="Arial,sans-serif" font-size="23" text-anchor="middle" fill="#111111">Anotar o recordar ubicación</text><text x="234.0" y="589.82" font-family="Arial,sans-serif" font-size="23" text-anchor="middle" fill="#111111">Decidir manejo agrícola</text><text x="766.0" y="589.82" font-family="Arial,sans-serif" font-size="23" text-anchor="middle" fill="#111111">Revisar cambios en otra visita</text><text x="32" y="736.0" font-family="Arial,sans-serif" font-size="22" font-weight="400" text-anchor="start" fill="#111111">Limitaciones: sin fotos sistemáticas, conteos comparables ni identidad de zona persistente.</text><text x="32" y="842.0" font-family="Arial,sans-serif" font-size="20" font-weight="400" text-anchor="start" fill="#505050">Fuente: problemática del proyecto · La decisión agrícola pertenece al productor.</text></svg>