font-weight="bold" text-anchor="middle" fill="#1f4e79">S1 Navegación</text><text x="410" y="168" font-size="17" font-weight="normal" text-anchor="middle" fill="#111">y captura</text><rect x="700" y="105" width="190" height="90" rx="6" fill="#f3f4f6" stroke="#222" stroke-width="2" stroke-dasharray="7 5"/><text x="795" y="144" font-size="19" font-weight="bold" text-anchor="middle" fill="#111">Go2 EDU</text><text x="795" y="168" font-size="16" font-weight="normal" text-anchor="middle" fill="#555555">hardware externo</text><rect x="300" y="285" width="220" height="90" rx="6" fill="#f3f4f6" stroke="#222" stroke-width="2"/><text x="410" y="324" font-size="19" font-weight="bold" text-anchor="middle" fill="#111">S2 Análisis visual</text><text x="410" y="348" font-size="16" font-weight="normal" text-anchor="middle" fill="#555555">frutos · maleza</text><rect x="300" y="465" width="220" height="90" rx="6" fill="#f3f4f6" stroke="#222" stroke-width="2"/><text x="410" y="504" font-size="19" font-weight="bold" text-anchor="middle" fill="#111">S3 Registro</text><text x="410" y="528" font-size="16" font-weight="normal" text-anchor="middle" fill="#555555">eventos · fotos</text><rect x="300" y="645" width="220" height="90" rx="6" fill="#f3f4f6" stroke="#222" stroke-width="2"/><text x="410" y="684" font-size="19" font-weight="bold" text-anchor="middle" fill="#111">S4 Consulta</text><text x="410" y="708" font-size="16" font-weight="normal" text-anchor="middle" fill="#555555">web + API</text><rect x="700" y="645" width="190" height="90" rx="6" fill="#f3f4f6" stroke="#222" stroke-width="2"/><text x="795" y="696" font-size="19" font-weight="bold" text-anchor="middle" fill="#111">Agricultor</text><text x="247" y="140" font-size="16" font-weight="normal" text-anchor="middle" fill="#111111">1 → misión</text><text x="247" y="176" font-size="16" font-weight="normal" text-anchor="middle" fill="#111111">10 ← cierre</text><text x="610" y="120" font-size="16" font-weight="normal" text-anchor="middle" fill="#111111">2·4 → recorrer</text><text x="610" y="156" font-size="16" font-weight="normal" text-anchor="middle" fill="#111111">3·5 ← estado</text><rect x="309" y="229" width="202" height="23" fill="white"/><text x="410" y="245" font-size="16" font-weight="normal" text-anchor="middle" fill="#111111">7 → solicitar análisis</text><rect x="305" y="409" width="211" height="23" fill="white"/><text x="410" y="425" font-size="16" font-weight="normal" text-anchor="middle" fill="#111111">8 → conteos y hallazgos</text><rect x="578" y="324" width="176" height="23" fill="white"/><text x="582" y="340" font-size="16" font-weight="normal" text-anchor="start" fill="#111111">6 → guardar captura</text><rect x="578" y="352" width="211" height="23" fill="white"/><text x="582" y="368" font-size="16" font-weight="normal" text-anchor="start" fill="#111111">9 ← registro confirmado</text><rect x="305" y="576" width="211" height="23" fill="white"/><text x="410" y="592" font-size="16" font-weight="normal" text-anchor="middle" fill="#111111">3 → consultar registros</text><rect x="326" y="602" width="168" height="23" fill="white"/><text x="410" y="618" font-size="16" font-weight="normal" text-anchor="middle" fill="#111111">4 ← estado y datos</text><text x="610" y="680" font-size="16" font-weight="normal" text-anchor="middle" fill="#111111">1 → seleccionar</text><text x="610" y="716" font-size="16" font-weight="normal" text-anchor="middle" fill="#111111">6 ← mostrar</text><text x="36" y="786" font-size="16" font-weight="normal" text-anchor="start" fill="#111111" font-style="italic">Los enlaces S3–S4 y S4–Agricultor se repiten en CU2, CU3 y CU4 (ficha, historial y mapa).</text><text x="36" y="834" font-size="16" font-weight="normal" text-anchor="start" fill="#555555">→ solicitud o dato enviado · ← respuesta o confirmación · Línea discontinua: hardware externo</text></svg>