<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 900" role="img" aria-labelledby="mockup_zona-title mockup_zona-desc"><title id="mockup_zona-title">Prototipo de ficha con evidencia y trazabilidad</title><desc id="mockup_zona-desc">Prototipo ilustrativo, sin mediciones reales, con controles y estados textuales.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polygon points="0 0,10 4,0 8" fill="#505050"/></marker></defs><rect width="100%" height="100%" fill="white"/><rect x="32" y="88" width="936" height="704" fill="white" stroke="#111111" stroke-width="1.5" /><rect x="32" y="88" width="936" height="68" fill="#edf4f8" stroke="#b8c3ca" stroke-width="1.5" /><rect x="56" y="248" width="424" height="288" rx="4" fill="#fafafa" stroke="#111111" stroke-width="2"/><rect x="524" y="488" width="392" height="72" rx="4" fill="#edf4f8" stroke="#174d70" stroke-width="2"/><rect x="56" y="692" width="264" height="60" rx="4" fill="#f3f5f6" stroke="#111111" stroke-width="2"/><rect x="352" y="692" width="284" height="60" rx="4" fill="#f3f5f6" stroke="#111111" stroke-width="2"/><rect x="668" y="692" width="248" height="60" rx="4" fill="#f3f5f6" stroke="#111111" stroke-width="2"/><text x="32" y="42.0" font-family="Arial,sans-serif" font-size="28" font-weight="600" text-anchor="start" fill="#111111">Prototipo de ficha con evidencia y trazabilidad</text><text x="56" y="132.0" font-family="Arial,sans-serif" font-size="26" font-weight="600" text-anchor="start" fill="#111111">SABUESO  |  Pampa Concordia</text><text x="52" y="840.0" font-family="Arial,sans-serif" font-size="22" font-weight="400" text-anchor="start" fill="#111111">Prototipo ilustrativo · Los conteos y fotografías se obtendrán del registro real.</text><text x="56" y="202.0" font-family="Arial,sans-serif" font-size="26" font-weight="600" text-anchor="start" fill="#111111">Hilera H2 · Zona Z3 · Recorrido y fecha de captura</text><text x="268.0" y="356.24" font-family="Arial,sans-serif" font-size="24" text-anchor="middle" fill="#111111">Fotografía de la zona</text><text x="268.0" y="385.52" font-family="Arial,sans-serif" font-size="24" text-anchor="middle" fill="#111111">marcas de detección</text><text x="268.0" y="414.8" font-family="Arial,sans-serif" font-size="24" text-anchor="middle" fill="#111111">ID de captura y hora</text><text x="268.0" y="444.08000000000004" font-family="Arial,sans-serif" font-size="24" text-anchor="middle" fill="#111111">[imagen del recorrido]</text><text x="524" y="276.0" font-family="Arial,sans-serif" font-size="23" font-weight="400" text-anchor="start" fill="#111111">Frutos verdes: por calcular</text><text x="524" y="304.06" font-family="Arial,sans-serif" font-size="23" font-weight="400" text-anchor="start" fill="#111111">Frutos maduros: por calcular</text><text x="524" y="332.12" font-family="Arial,sans-serif" font-size="23" font-weight="400" text-anchor="start" fill="#111111">Maleza: resultado del análisis</text><text x="524" y="360.18" font-family="Arial,sans-serif" font-size="23" font-weight="400" text-anchor="start" fill="#111111">Follaje: signos por revisar</text><text x="524" y="388.24" font-family="Arial,sans-serif" font-size="23" font-weight="400" text-anchor="start" fill="#111111">Modelo: versión registrada</text><text x="720.0" y="531.82" font-family="Arial,sans-serif" font-size="23" text-anchor="middle" fill="#111111">Estado: análisis pendiente</text><text x="56" y="596.0" font-family="Arial,sans-serif" font-size="23" font-weight="400" text-anchor="start" fill="#111111">Evidencia por hallazgo: tipo · imagen · confianza · evento único.</text><text x="56" y="644.0" font-family="Arial,sans-serif" font-size="23" font-weight="400" text-anchor="start" fill="#111111">Imagen ausente: conservar metadatos y mostrar la incidencia.</text><text x="188.0" y="729.82" font-family="Arial,sans-serif" font-size="23" text-anchor="middle" fill="#111111">Volver al mapa</text><text x="494.0" y="729.82" font-family="Arial,sans-serif" font-size="23" text-anchor="middle" fill="#111111">Consultar historial</text><text x="792.0" y="729.82" font-family="Arial,sans-serif" font-size="23" text-anchor="middle" fill="#111111">Reintentar carga</text></svg>