t><rect x="75.39999999999999" y="185.0" width="249.20000000000002" height="32" fill="white"/><text x="200.0" y="210.0" font-family="Arial,sans-serif" font-size="22" font-weight="400" text-anchor="middle" fill="#111111">1 Seleccionar misión</text><rect x="287.06" y="253.0" width="225.88000000000002" height="32" fill="white"/><text x="400.0" y="278.0" font-family="Arial,sans-serif" font-size="22" font-weight="400" text-anchor="middle" fill="#111111">2 Verificar equipo</text><rect x="281.23" y="321.0" width="237.54000000000002" height="32" fill="white"/><text x="400.0" y="346.0" font-family="Arial,sans-serif" font-size="22" font-weight="400" text-anchor="middle" fill="#111111">3 Estado y sensores</text><text x="240" y="432.0" font-family="Arial,sans-serif" font-size="22" font-weight="600" text-anchor="start" fill="#111111">LOOP [cada zona; operación segura]</text><rect x="269.57" y="453.0" width="260.86" height="32" fill="white"/><text x="400.0" y="478.0" font-family="Arial,sans-serif" font-size="22" font-weight="400" text-anchor="middle" fill="#111111">4 Recorrer y capturar</text><rect x="269.57" y="529.0" width="260.86" height="32" fill="white"/><text x="400.0" y="554.0" font-family="Arial,sans-serif" font-size="22" font-weight="400" text-anchor="middle" fill="#111111">5 Imagen + telemetría</text><rect x="382.12" y="605.0" width="435.76000000000005" height="32" fill="white"/><text x="600.0" y="630.0" font-family="Arial,sans-serif" font-size="22" font-weight="400" text-anchor="middle" fill="#111111">6 Guardar captura misión/hilera/zona</text><rect x="311.27" y="681.0" width="377.46000000000004" height="32" fill="white"/><text x="500.0" y="706.0" font-family="Arial,sans-serif" font-size="22" font-weight="400" text-anchor="middle" fill="#111111">7 Solicitar análisis de captura</text><rect x="617.1" y="753.0" width="365.8" height="32" fill="white"/><text x="800.0" y="778.0" font-family="Arial,sans-serif" font-size="22" font-weight="400" text-anchor="middle" fill="#111111">8 Conteos + hallazgos + modelo</text><rect x="469.57" y="841.0" width="260.86" height="32" fill="white"/><text x="600.0" y="866.0" font-family="Arial,sans-serif" font-size="22" font-weight="400" text-anchor="middle" fill="#111111">9 Registro confirmado</text><rect x="28.75999999999999" y="917.0" width="342.48" height="32" fill="white"/><text x="200.0" y="942.0" font-family="Arial,sans-serif" font-size="22" font-weight="400" text-anchor="middle" fill="#111111">10 Cierre + zonas pendientes</text><text x="32" y="1012.0" font-family="Arial,sans-serif" font-size="22" font-weight="400" text-anchor="start" fill="#111111">Si falla la validación: no iniciar. Si falla la captura: registrar incidencia.</text><text x="32" y="1106.0" font-family="Arial,sans-serif" font-size="20" font-weight="400" text-anchor="start" fill="#505050">RF1–RF6 · RFN5 · La confirmación del registro habilita la publicación de resultados.</text></svg>