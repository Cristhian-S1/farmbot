(#arrow)"/><path d="M 56 612 L 40 612 L 40 348 L 412 348 L 412 328" fill="none" stroke="#505050" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/><path d="M 68 450 L 52 450 L 52 716 L 412 716 L 412 736" fill="none" stroke="#505050" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/><path d="M 492 664 L 492 736" fill="none" stroke="#505050" stroke-width="2"  marker-end="url(#arrow)"/><path d="M 616 784 L 688 784" fill="none" stroke="#505050" stroke-width="2"  marker-end="url(#arrow)"/><path d="M 812 832 L 812 888" fill="none" stroke="#505050" stroke-width="2"  marker-end="url(#arrow)"/><path d="M 812 1004 L 812 1040" fill="none" stroke="#505050" stroke-width="2"  marker-end="url(#arrow)"/><path d="M 812 1128 L 812 1172" fill="none" stroke="#505050" stroke-width="2"  marker-end="url(#arrow)"/><path d="M 920 946 L 952 946 L 952 1194 L 834 1194" fill="none" stroke="#505050" stroke-width="2"  marker-end="url(#arrow)"/><ellipse cx="178.0" cy="174.0" rx="22.0" ry="22.0" fill="white" stroke="#111111" stroke-width="2"/><rect x="56" y="232" width="248" height="96" rx="4" fill="#f3f5f6" stroke="#111111" stroke-width="2"/><rect x="368" y="232" width="248" height="96" rx="4" fill="#edf4f8" stroke="#174d70" stroke-width="2"/><polygon points="492.0,392 600,450.0 492.0,508 384,450.0" fill="#f3f5f6" stroke="#111111" stroke-width="2"/><polygon points="180.0,392 292,450.0 180.0,508 68,450.0" fill="#f3f5f6" stroke="#111111" stroke-width="2"/><rect x="56" y="556" width="248" height="108" rx="4" fill="#f3f5f6" stroke="#111111" stroke-width="2"/><rect x="368" y="556" width="248" height="108" rx="4" fill="#f3f5f6" stroke="#111111" stroke-width="2"/><rect x="368" y="736" width="248" height="96" rx="4" fill="#f3f5f6" stroke="#111111" stroke-width="2"/><rect x="688" y="736" width="248" height="96" rx="4" fill="#f3f5f6" stroke="#111111" stroke-width="2"/><polygon points="812.0,888 920,946.0 812.0,1004 704,946.0" fill="#f3f5f6" stroke="#111111" stroke-width="2"/><rect x="688" y="1040" width="248" height="88" rx="4" fill="#f3f5f6" stroke="#111111" stroke-width="2"/><ellipse cx="812.0" cy="1194.0" rx="22.0" ry="22.0" fill="white" stroke="#111111" stroke-width="5"/><text x="32" y="42.0" font-family="Arial,sans-serif" font-size="28" font-weight="600" text-anchor="start" fill="#111111">Proceso propuesto de monitoreo y revisión agrícola</text><text x="180" y="120.0" font-family="Arial,sans-serif" font-size="25" font-weight="600" text-anchor="middle" fill="#111111">Operario</text><text x="500" y="120.0" font-family="Arial,sans-serif" font-size="25" font-weight="600" text-anchor="middle" fill="#111111">Sabueso</text><text x="820" y="120.0" font-family="Arial,sans-serif" font-size="25" font-weight="600" text-anchor="middle" fill="#111111">Agricultor</text><text x="178.0" y="182.16" font-family="Arial,sans-serif" font-size="24" text-anchor="middle" fill="#111111"></text><text x="180.0" y="273.52000000000004" font-family="Arial,sans-serif" font-size="24" text-anchor="middle" fill="#111111">Preparar equipo</text><text x="180.0" y="302.80000000000007" font-family="Arial,sans-serif" font-size="24" text-anchor="middle" fill="#111111">y configurar misión</text><text x="492.0" y="273.79" font-family="Arial,sans-serif" font-size="23" text-anchor="middle" fill="#111111">Verificar condiciones</text><text x="492.0" y="301.85" font-family="Arial,sans-serif" font-size="23" text-anchor="middle" fill="#111111">y ejecutar recorrido</text><text x="492.0" y="443.52000000000004" font-family="Arial,sans-serif" font-size="24" text-anchor="middle" fill="#111111">¿Hay</text><text x="492.0" y="472.80000000000007" font-family="Arial,sans-serif" font-size="24" text-anchor="middle" fill="#111111">incidencia?</text><text x="180.0" y="443.52000000000004" font-family="Arial,sans-serif" font-size="24" text-anchor="middle" fill="#111111">¿Puede</text><text x="180.0" y="472.80000000000007" font-family="Arial,sans-serif" font-size="24" text-anchor="middle" fill="#111111">corregirse?</text><text x="180.0" y="588.88" font-family="Arial,sans-serif" font-size="24" text-anchor="middle" fill="#111111">Corregir incidencia</text><text x="180.0" y="618.16" font-family="Arial,sans-serif" font-size="24" text-anchor="middle" fill="#111111">y autorizar</text><text x="180.0" y="647.44" font-family="Arial,sans-serif" font-size="24" text-anchor="middle" fill="#111111">reanudación</text><text x="492.0" y="603.52" font-family="Arial,sans-serif" font-size="24" text-anchor="middle" fill="#111111">Capturar y analizar</text><text x="492.0" y="632.8" font-family="Arial,sans-serif" font-size="24" text-anchor="middle" fill="#111111">por hilera y zona</text><text x="492.0" y="777.7900000000001" font-family="Arial,sans-serif" font-size="23" text-anchor="middle" fill="#111111">Registrar evidencia</text><text x="492.0" y="805.85" font-family="Arial,sans-serif" font-size="23" text-anchor="middle" fill="#111111">y estado de la misión</text><text x="812.0" y="777.52" font-family="Arial,sans-serif" font-size="24" text-anchor="middle" fill="#111111">Consultar ficha</text><text x="812.0" y="806.8" font-family="Arial,sans-serif" font-size="24" text-anchor="middle" fill="#111111">y revisar evidencia</text><text x="812.0" y="939.52" font-family="Arial,sans-serif" font-size="24" text-anchor="middle" fill="#111111">¿Requiere</text><text x="812.0" y="968.8" font-family="Arial,sans-serif" font-size="24" text-anchor="middle" fill="#111111">inspección?</text><text x="812.0" y="1077.52" font-family="Arial,sans-serif" font-size="24" text-anchor="middle" fill="#111111">Inspeccionar zona</text><text x="812.0" y="1106.8" font-family="Arial,sans-serif" font-size="24" text-anchor="middle" fill="#111111">y decidir manejo</text><rect x="530.87" y="518.0" width="38.260000000000005" height="31" fill="white"/><text x="550" y="542.0" font-family="Arial,sans-serif" font-size="21" font-weight="400" text-anchor="middle" fill="#111111">NO</text><rect x="322.87" y="402.0" width="38.260000000000005" height="31" fill="white"/><text x="342" y="426.0" font-family="Arial,sans-serif" font-size="21" font-weight="400" text-anchor="middle" fill="#111111">SÍ</text><rect x="208.87" y="518.0" width="38.260000000000005" height="31" fill="white"/><text x="228" y="542.0" font-family="Arial,sans-serif" font-size="21" font-weight="400" text-anchor="middle" fill="#111111">SÍ</text><rect x="181.48" y="354.0" width="105.04" height="31" fill="white"/><text x="234" y="378.0" font-family="Arial,sans-serif" font-size="21" font-weight="400" text-anchor="middle" fill="#111111">REANUDAR</text><rect x="148.08999999999997" y="672.0" width="171.82000000000002" height="31" fill="white"/><text x="234" y="696.0" font-family="Arial,sans-serif" font-size="21" font-weight="400" text-anchor="middle" fill="#111111">NO: INCOMPLETA</text><rect x="599.48" y="692.0" width="105.04" height="31" fill="white"/><text x="652" y="716.0" font-family="Arial,sans-serif" font-size="21" font-weight="400" text-anchor="middle" fill="#111111">PUBLICAR</text><rect x="840.87" y="1004.0" width="38.260000000000005" height="31" fill="white"/><text x="860" y="1028.0" font-family="Arial,sans-serif" font-size="21" font-weight="400" text-anchor="middle" fill="#111111">SÍ</text><text x="812.0" y="1202.16" font-family="Arial,sans-serif" font-size="24" text-anchor="middle" fill="#111111"></text><rect x="928.87" y="1016.0" width="38.260000000000005" height="31" fill="white"/><text x="948" y="1040.0" font-family="Arial,sans-serif" font-size="21" font-weight="400" text-anchor="middle" fill="#111111">NO</text><text x="56" y="932.0" font-family="Arial,sans-serif" font-size="23" font-weight="400" text-anchor="start" fill="#111111">Revisión completada</text><text x="56" y="960.06" font-family="Arial,sans-serif" font-size="23" font-weight="400" text-anchor="start" fill="#111111">no equivale a salud total.</text><text x="56" y="988.12" font-family="Arial,sans-serif" font-size="23" font-weight="400" text-anchor="start" fill="#111111">El agricultor conserva</text><text x="56" y="1016.18" font-family="Arial,sans-serif" font-size="23" font-weight="400" text-anchor="start" fill="#111111">la decisión de manejo.</text><text x="32" y="1272.0" font-family="Arial,sans-serif" font-size="20" font-weight="400" text-anchor="start" fill="#111111">El cierre expresa una revisión completada; la inspección y el tratamiento son decisiones agrícolas.</text></svg></div></main></body></html>
