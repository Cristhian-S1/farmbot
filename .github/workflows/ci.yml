name: CI

on:
  push:
  pull_request:

jobs:
  pruebas:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.8"
      - run: python -m pip install pytest PyYAML
      - run: python -m pytest
      - run: shellcheck scripts/red/*.sh scripts/robot/*.sh
