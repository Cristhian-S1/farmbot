name: CI

on:
  push:
  pull_request:

jobs:
  # Los .md usan dos espacios finales como salto de línea y se excluyen.
  # Agregar aquí las pruebas cuando src/ o ui/ tengan código.
  espacios:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - run: git diff --check "$(git hash-object -t tree /dev/null)" HEAD -- . ':!*.md'
