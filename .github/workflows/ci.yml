name: CI

on:
  push:
  pull_request:

jobs:
  # Los .md usan dos espacios finales como salto de línea y se excluyen.
  espacios:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - run: git diff --check "$(git hash-object -t tree /dev/null)" HEAD -- . ':!*.md'

  # Python 3.8, como en el dock del Go2.
  api:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: ui/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.8"
      - run: pip install -r requirements.txt
      - run: python -m unittest -v

  web:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: ui/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ui/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
