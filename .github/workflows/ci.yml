name: CI

on:
  push:
  pull_request:

jobs:
  # Los .md usan dos espacios finales como salto de línea y se excluyen.
  # Cada equipo agrega aquí sus pruebas cuando terrestre/, aereo/ o interfaz/ tengan código.
  espacios:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - run: git diff --check "$(git hash-object -t tree /dev/null)" HEAD -- . ':!*.md'
